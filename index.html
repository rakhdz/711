<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>711 -  خدمات انسانية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Almarai Font -->
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Almarai', Arial, sans-serif;
      color: #fff;
      text-align: center;
      direction: rtl;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
    }

    .content { position: relative; z-index: 2; }

    /* ===== دوائر صاعدة ===== */
    .rising-circles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      bottom: -160px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.4;
      animation: riseCircle linear infinite;
    }

    @keyframes riseCircle {
      0% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-120vh) scale(1.3); opacity: 0; }
    }

    /* ===== Header ===== */
    header {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 30px 20px 20px;
      margin-bottom: 30px;
      border-radius: 0 0 60px 60px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 2.6em;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(45deg, #fff, #f0f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    header p {
      font-family: 'Almarai', Arial, sans-serif; 
      font-size: 0.9em;
      opacity: 0.9;
      font-weight: 300;
    }

    /* ===== Eye Blink ===== */
    .eye {
      width: 34px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      position: relative;
      overflow: hidden;
    }

    .eye::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .lid {
      position: absolute;
      inset: 0;
      background: #fff;
      transform: translateY(-100%);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 90%, 100% { transform: translateY(-100%); }
      92%, 96% { transform: translateY(0); }
    }

    /* ===== Container ===== */
    .container {
      padding: 10px 20px;
      max-width: 420px;
      margin: auto;
    }

    .btn {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 380px;
      margin: 18px auto;
      padding: 22px 30px;
      font-size: 1.25em;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,0.08);
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      transition: 0.4s;
    }

    .btn i {
      margin-left: 20px;
      font-size: 1.4em;
      min-width: 40px;
    }

    .btn:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-6px);
    }

    .whatsapp-btn {
      background: linear-gradient(135deg, #25D366, #128C7E);
    }

    /* ===== Footer ===== */
    .footer {
      margin-top: 30px; /* تم رفع الحقوق للأعلى هنا */
      padding: 15px 0;
      font-size: 0.65em;
      color: rgba(255,255,255,0.35);
      transform: translateY(-20px);
    }

    /* ===== تحسينات الهاتف ===== */
    @media (max-width: 768px) {
      .btn {
        padding: 22px 20px;
        font-size: 1.15em;
        margin: 15px auto;
      }
      .btn i { font-size: 1.5em; }
      .circle { filter: blur(4px); opacity: 0.35; }
      .btn:hover { transform: none; }
      header h1 { font-size: 2.1em; }
    }

    /* ===== Reduce Motion ===== */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="rising-circles"></div>

  <div class="content">
    <header>
      <h1>711 <span class="eye"><span class="lid"></span></span></h1>
      <p>خدمات إنسانية للمجتمع</p>
    </header>

    <div class="container">
      <a class="btn" href="https://rakhdz.github.io/sad/" target="_blank">
        <i class="fa-solid fa-circle-exclamation"></i> تبليغ
      </a>

      <a class="btn" href="https://is.gd/6NcdSn" target="_blank">
        <i class="fa-solid fa-droplet"></i> تبرع أو طلب الدم
      </a>

      <a class="btn" href="https://is.gd/PimyH3" target="_blank">
        <i class="fa-solid fa-briefcase"></i> بحث عن عمل / عمال
      </a>

      <a class="btn whatsapp-btn" href="https://rakhdz.github.io/baqiat/" target="_blank">
        <i class="fa-solid fa-hand-holding-heart"></i> تبرع للخير
      </a>
    </div>

    <div class="footer">
      جميع الحقوق محفوظة لجمعية رعاية الأيتام الخيرية ©
    </div>
  </div>

  <script>
    const container = document.querySelector('.rising-circles');
    const isMobile = window.innerWidth < 768;
    const totalCircles = isMobile ? 16 : 30;

    for (let i = 0; i < totalCircles; i++) {
      const c = document.createElement('div');
      c.className = 'circle';
      const size = Math.random() * 100 + 50;
      c.style.width = c.style.height = size + 'px';
      c.style.left = Math.random() * 100 + '%';
      c.style.animationDuration = (15 + Math.random() * 20) + 's';
      c.style.animationDelay = Math.random() * 10 + 's';
      container.appendChild(c);
    }

    if (!isMobile) {
      document.addEventListener('mousemove', e => {
        const x = (e.clientX / window.innerWidth - 0.5) * 20;
        const y = (e.clientY / window.innerHeight - 0.5) * 20;
        container.style.transform = `translate(${x}px, ${y}px)`;
      });
    }
  </script>

</body>
</html>
